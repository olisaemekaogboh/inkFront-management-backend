server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript
      - application/x-javascript

spring:
  application:
    name: agency-platform

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    test-connection: true

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL}
    oauth2-success-path: /login/success

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  mail:
    from: ${MAIL_FROM}
    admin-to: ${ADMIN_EMAIL}

  security:
    jwt-secret: ${JWT_SECRET_BASE64}

    access-token-validity-seconds: 900
    refresh-token-validity-seconds: 604800

    jwt:
      issuer: agency-platform
      access-token-secret: ${JWT_ACCESS_SECRET}
      refresh-token-secret: ${JWT_REFRESH_SECRET}
      access-token-expiration-seconds: 900
      refresh-token-expiration-seconds: 604800

    cookie:
      access-token-name: agency_access_token
      refresh-token-name: agency_refresh_token
      secure: ${COOKIE_SECURE}
      http-only: true
      same-site: ${COOKIE_SAME_SITE}
      path: /
      access-token-max-age-seconds: 900
      refresh-token-max-age-seconds: 604800

inkfront:
  notifications:
    admin-email: ${INKFRONT_ADMIN_EMAIL}

    whatsapp:
      enabled: ${INKFRONT_WHATSAPP_ENABLED}
      phone-number-id: ${INKFRONT_WHATSAPP_PHONE_NUMBER_ID}
      access-token: ${INKFRONT_WHATSAPP_ACCESS_TOKEN}
      admin-phone: ${INKFRONT_WHATSAPP_ADMIN_PHONE}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"